<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">十二个研究主阶段</title><desc id="desc">科研技能包的十二个主阶段分为立项、证据、论证和去向四组，第八点五步为可追溯闸门。</desc>
  <rect width="1600" height="620" fill="#f8fafc" rx="30"/><text x="800" y="65" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#0f172a">十二个研究主阶段</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <g fill="#eff6ff" stroke="#2563eb" stroke-width="3"><rect x="45" y="115" width="350" height="410" rx="24"/></g><text x="220" y="160" fill="#1e3a5f">立项：确定值得做什么</text>
    <g fill="#faf5ff" stroke="#7c3aed" stroke-width="3"><rect x="430" y="115" width="350" height="410" rx="24"/></g><text x="605" y="160" fill="#3b0764">证据：确定凭什么做</text>
    <g fill="#fff7ed" stroke="#ea580c" stroke-width="3"><rect x="815" y="115" width="350" height="410" rx="24"/></g><text x="990" y="160" fill="#7c2d12">论证：让研究形成论文</text>
    <g fill="#f0fdf4" stroke="#16a34a" stroke-width="3"><rect x="1200" y="115" width="355" height="410" rx="24"/></g><text x="1377" y="160" fill="#14532d">去向：提交并留下档案</text>
    <g font-size="19" font-weight="600" fill="#334155"><text x="220" y="225">1 背景采集与选题雷达</text><text x="220" y="295">2 发现研究空白</text><text x="220" y="365">3 立项评审委员会</text><text x="605" y="225">4 文献操作系统</text><text x="605" y="295">5 研究设计</text><text x="605" y="365">6 数据与证据</text><text x="990" y="215">7 论文架构师</text><text x="990" y="275">8 学术写作</text><text x="990" y="335">8.5 可追溯闸门</text><text x="990" y="395">9 引用审计</text><text x="990" y="455">10 模拟审稿</text><text x="1377" y="250">11 期刊与会议匹配</text><text x="1377" y="340">12 投稿与项目归档</text></g>
  </g>
  <g stroke="#94a3b8" stroke-width="3"><path d="M95 248H345M95 318H345M95 388H345M480 248H730M480 318H730M480 388H730M865 238H1115M865 298H1115M865 358H1115M865 418H1115M1250 273H1505M1250 363H1505"/></g>
  <text x="800" y="575" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#64748b">每一阶段由可验证的细粒度工作单元支撑，并通过版本化产物连接到下一阶段。</text>
</svg>
