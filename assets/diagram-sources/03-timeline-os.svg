<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="670" viewBox="0 0 1550 670" role="img" aria-labelledby="title desc">
  <title id="title">科研时间线系统</title><desc id="desc">截止日期、真实时间容量和任务依赖共同生成计划；进度偏离时系统提出重排建议，用户确认后才替代旧计划。</desc>
  <rect width="1550" height="670" fill="#f8fafc" rx="30"/><text x="775" y="65" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#0f172a">科研时间线与里程碑系统</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle"><g stroke-width="3"><rect x="55" y="150" width="220" height="100" rx="20" fill="#dbeafe" stroke="#2563eb"/><rect x="55" y="360" width="220" height="100" rx="20" fill="#dbeafe" stroke="#2563eb"/><rect x="360" y="255" width="220" height="100" rx="20" fill="#ede9fe" stroke="#7c3aed"/><rect x="665" y="255" width="220" height="100" rx="20" fill="#ede9fe" stroke="#7c3aed"/><rect x="970" y="255" width="220" height="100" rx="20" fill="#ede9fe" stroke="#7c3aed"/><rect x="1275" y="255" width="220" height="100" rx="20" fill="#fef9c3" stroke="#ca8a04"/></g>
    <g font-size="22" font-weight="700" fill="#1e293b"><text x="165" y="195">最终提交日期</text><text x="165" y="405">周容量与不可用时间</text><text x="470" y="300">确认时间线基线</text><text x="775" y="300">执行计划与关键路径</text><text x="1080" y="300">本周行动与进度对照</text><text x="1385" y="300">是否按计划推进？</text></g>
    <g font-size="17" fill="#475569"><text x="165" y="225">倒排硬节点与缓冲</text><text x="165" y="435">不把理想时间当资源</text><text x="470" y="330">用户确认后生效</text><text x="775" y="330">依赖、等待项、里程碑</text><text x="1080" y="330">项目产物 + 用户确认</text><text x="1385" y="330">不擅自改写计划</text></g></g>
  <g stroke="#64748b" stroke-width="4" fill="none"><path d="M275 200H335V275H340"/><path d="M275 410H335V335H340"/><path d="M580 305H645M885 305H950M1190 305H1255"/></g><g fill="#64748b"><path d="M340 265l20 10-20 10z"/><path d="M645 295l20 10-20 10z"/><path d="M950 295l20 10-20 10z"/><path d="M1255 295l20 10-20 10z"/></g>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle"><rect x="1015" y="500" width="300" height="90" rx="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="1165" y="540" font-size="22" font-weight="700" fill="#7c2d12">提出重排方案</text><text x="1165" y="570" font-size="17" fill="#7c2d12">只给建议，不自动替代计划</text><path d="M1385 355V445H1165V487" fill="none" stroke="#ca8a04" stroke-width="3" stroke-dasharray="8 8"/><path d="M1015 545H620V375H470V368" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 8"/><path d="M1158 487l7 13 7-13z" fill="#ca8a04"/><path d="M463 368l7-13 7 13z" fill="#ea580c"/><text x="1408" y="420" font-size="18" fill="#854d0e">延期</text><text x="790" y="530" font-size="18" fill="#9a3412">用户确认后重建基线</text></g>
</svg>
