<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="560" viewBox="0 0 1450 560" role="img" aria-labelledby="title desc">
  <title id="title">科研技能包架构</title><desc id="desc">研究者通过科研总入口进入宏观阶段技能和细粒度技能，所有结果以版本化产物写入项目状态真源，再被总入口读取。</desc>
  <rect width="1450" height="560" fill="#f8fafc" rx="30"/><text x="725" y="70" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#0f172a">科研技能包：从对话到可追溯项目状态</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle"><g stroke-width="3"><rect x="65" y="210" width="185" height="115" rx="22" fill="#dbeafe" stroke="#2563eb"/><rect x="325" y="210" width="195" height="115" rx="22" fill="#ede9fe" stroke="#7c3aed"/><rect x="595" y="210" width="195" height="115" rx="22" fill="#ede9fe" stroke="#7c3aed"/><rect x="865" y="210" width="195" height="115" rx="22" fill="#ffedd5" stroke="#ea580c"/><rect x="1135" y="210" width="245" height="115" rx="22" fill="#dcfce7" stroke="#16a34a"/></g>
    <g font-size="22" font-weight="700"><text x="158" y="258" fill="#1e3a5f">研究者</text><text x="422" y="250" fill="#3b0764">科研总入口</text><text x="692" y="250" fill="#3b0764">宏观阶段技能</text><text x="962" y="250" fill="#7c2d12">170+ 细技能</text><text x="1257" y="250" fill="#14532d">版本化项目产物</text></g>
    <g font-size="17" fill="#475569"><text x="158" y="290">提出需求、确认决定</text><text x="422" y="285">检查闸门、路由下一步</text><text x="692" y="285">选题、文献、设计、写作</text><text x="962" y="285">每次只完成一个工作单元</text><text x="1257" y="285">项目状态真源与报告</text></g></g>
  <g stroke="#64748b" stroke-width="4" fill="none"><path d="M250 268H305M520 268H575M790 268H845M1060 268H1115"/></g><g fill="#64748b"><path d="M305 258l20 10-20 10z"/><path d="M575 258l20 10-20 10z"/><path d="M845 258l20 10-20 10z"/><path d="M1115 258l20 10-20 10z"/></g>
  <path d="M1257 325V420H422V325" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="9 8"/><text x="840" y="465" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#166534">项目状态会反馈给总入口，让下一次对话知道研究走到哪里。</text>
</svg>
