<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">科研项目状态机</title><desc id="desc">项目从需求采集草稿逐步进入选题、空白、设计、证据、论文、审稿、投稿准备和归档；受阻、调整方向和终止研究也是显式状态。</desc>
  <rect width="1600" height="650" fill="#f8fafc" rx="30"/><text x="800" y="65" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#0f172a">科研项目状态机</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle" font-size="18" font-weight="600" fill="#1e293b"><g fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"><rect x="45" y="160" width="150" height="70" rx="18"/><rect x="220" y="160" width="150" height="70" rx="18"/><rect x="395" y="160" width="150" height="70" rx="18"/><rect x="570" y="160" width="150" height="70" rx="18"/><rect x="745" y="160" width="150" height="70" rx="18"/><rect x="920" y="160" width="150" height="70" rx="18"/><rect x="1095" y="160" width="150" height="70" rx="18"/><rect x="1270" y="160" width="150" height="70" rx="18"/></g>
    <text x="120" y="202">需求采集草稿</text><text x="295" y="202">需求已确认</text><text x="470" y="202">选题已评估</text><text x="645" y="202">研究空白就绪</text><text x="820" y="202">立项已决策</text><text x="995" y="202">研究设计就绪</text><text x="1170" y="202">证据已就绪</text><text x="1345" y="202">论文蓝图就绪</text>
    <g fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"><rect x="220" y="350" width="160" height="70" rx="18"/><rect x="430" y="350" width="160" height="70" rx="18"/><rect x="640" y="350" width="160" height="70" rx="18"/><rect x="850" y="350" width="160" height="70" rx="18"/><rect x="1060" y="350" width="160" height="70" rx="18"/></g>
    <text x="300" y="392">论文已审计</text><text x="510" y="392">模拟审稿就绪</text><text x="720" y="392">期刊匹配就绪</text><text x="930" y="392">投稿准备就绪</text><text x="1140" y="392">项目已归档</text>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none"><path d="M195 195H207M370 195H382M545 195H557M720 195H732M895 195H907M1070 195H1082M1245 195H1257M1345 230V300H300V337M380 385H417M590 385H627M800 385H837M1010 385H1047"/></g><g fill="#64748b"><path d="M207 188l13 7-13 7z"/><path d="M382 188l13 7-13 7z"/><path d="M557 188l13 7-13 7z"/><path d="M732 188l13 7-13 7z"/><path d="M907 188l13 7-13 7z"/><path d="M1082 188l13 7-13 7z"/><path d="M1257 188l13 7-13 7z"/><path d="M293 337l7 13 7-13z"/><path d="M417 378l13 7-13 7z"/><path d="M627 378l13 7-13 7z"/><path d="M837 378l13 7-13 7z"/><path d="M1047 378l13 7-13 7z"/></g>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle"><rect x="365" y="510" width="210" height="70" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/><text x="470" y="553" fill="#9a3412">调整方向后重新评估</text><rect x="740" y="510" width="160" height="70" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/><text x="820" y="553" fill="#991b1b">发现致命缺陷，终止</text><rect x="915" y="510" width="160" height="70" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2.5"/><text x="995" y="553" fill="#854d0e">缺少条件时项目受阻</text></g>
  <g fill="none" stroke-width="3" stroke-dasharray="8 7"><path d="M470 230H150V480H470V497" stroke="#ea580c"/><path d="M820 230H620V480H820V497" stroke="#dc2626"/><path d="M995 230H1040V480H995V497" stroke="#ca8a04"/></g><g fill="#64748b"><path d="M463 497l7 13 7-13z"/><path d="M813 497l7 13 7-13z"/><path d="M988 497l7 13 7-13z"/></g>
