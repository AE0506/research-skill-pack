[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-skill-pack"
version = "0.2.0"
description = "Validation tools for the local, evidence-first Research Skill Pack."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27,<2",
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
