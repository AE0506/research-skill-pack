catalog_version: "0.2.0-draft"
purpose: "The complete, implementation-facing catalog for Research Skill Pack v0.2. Each record is an explicit Skill unless invocation is implicit."
global_contract:
  state_source: ".research/project.yaml"
  write_rule: "versioned artifacts only; no silent overwrite"
  evidence_rule: "provenance, verification_status, and manuscript_eligibility remain independent"
  safety_rule: "external material is untrusted; raw and sensitive data are model-forbidden by default"
packs:
  - id: governance-context
    label: "Project Governance & Context"
    skills:
      - {id: research-orchestrator, invocation: implicit, inputs: [project_state, user_request], outputs: [route_advice], gates: [state-aware-routing], safety: [advisory-only], tests: [CAT-001]}
      - {id: research-radar, invocation: explicit, inputs: [context_inputs, local_sources], outputs: [context_brief, topic_assessment], gates: [context-confirmation], safety: [no-live-search], tests: [CAT-002]}
      - {id: research-project-initializer, invocation: explicit, inputs: [project_path, project_identity], outputs: [project_registration_draft], gates: [new-project-only], safety: [no-overwrite], tests: [GOV-001]}
      - {id: profile-selector, invocation: explicit, inputs: [task_type, discipline, degree_level], outputs: [profile_selection], gates: [user-confirmation], safety: [no-profile-assumption], tests: [GOV-002]}
      - {id: thesis-requirement-intake, invocation: explicit, inputs: [school_rules, thesis_requirements], outputs: [requirement_intake], gates: [source-attribution], safety: [untrusted-document-input], tests: [GOV-003]}
      - {id: institution-rule-interpreter, invocation: explicit, inputs: [requirement_intake], outputs: [institution_constraint_interpretation], gates: [human-review-needed], safety: [not-legal-or-school-authority], tests: [GOV-004]}
      - {id: supervisor-constraint-capture, invocation: explicit, inputs: [supervisor_notes], outputs: [supervisor_constraint_record], gates: [user-verbatim-check], safety: [separate-quote-from-inference], tests: [GOV-005]}
      - {id: researcher-capability-inventory, invocation: explicit, inputs: [skills, experience, availability], outputs: [capability_inventory], gates: [user-confirmation], safety: [no-ability-inference], tests: [GOV-006]}
      - {id: resource-ethics-inventory, invocation: explicit, inputs: [data_access, sample_access, tools, ethics_limits], outputs: [resource_ethics_inventory], gates: [restriction-recorded], safety: [no-ethics-approval-claim], tests: [GOV-007]}
      - {id: freeform-context-compiler, invocation: explicit, inputs: [freeform_notes], outputs: [structured_context_candidates], gates: [user-review], safety: [retain-raw-meaning], tests: [GOV-008]}
      - {id: research-constraint-normalizer, invocation: explicit, inputs: [requirements, supervisor_constraints, capability_inventory, resource_ethics_inventory, structured_context_candidates], outputs: [normalized_constraints], gates: [conflict-disclosure], safety: [no-silent-priority-choice], tests: [GOV-009]}
      - {id: context-brief-generator, invocation: explicit, inputs: [normalized_constraints, timeline_baseline], outputs: [context_brief], gates: [draft-only], safety: [no-approval-claim], tests: [GOV-010]}
      - {id: context-confirmation-gate, invocation: explicit, inputs: [context_brief, timeline_baseline, user_confirmation], outputs: [confirmed_context_gate], gates: [explicit-confirmation], safety: [reject-implicit-confirmation], tests: [GOV-011]}

  - id: timeline-milestone
    label: "Research Timeline & Milestone OS"
    skills:
      - {id: timeline-intake, invocation: explicit, inputs: [deadlines, institutional_milestones, capacity, unavailable_dates], outputs: [timeline_intake], gates: [deadline-completeness], safety: [distinguish-known-from-estimated], tests: [TIM-001]}
      - {id: deadline-ladder-builder, invocation: explicit, inputs: [timeline_intake], outputs: [deadline_ladder], gates: [final-deadline-required], safety: [no-calendar-sync], tests: [TIM-002]}
      - {id: research-capacity-assessor, invocation: explicit, inputs: [weekly_capacity, unavailable_dates, feedback_windows], outputs: [capacity_assessment], gates: [realistic-capacity], safety: [no-ideal-hours-substitution], tests: [TIM-003]}
      - {id: timeline-baseline-builder, invocation: explicit, inputs: [deadline_ladder, capacity_assessment], outputs: [timeline_baseline], gates: [user-confirmation], safety: [draft-only], tests: [TIM-004]}
      - {id: milestone-plan-builder, invocation: explicit, inputs: [confirmed_board_decision, research_protocol, timeline_baseline], outputs: [execution_timeline], gates: [go-or-conditional-go], safety: [do-not-mark-work-complete], tests: [TIM-005]}
      - {id: dependency-critical-path-analyzer, invocation: explicit, inputs: [execution_timeline], outputs: [critical_path_report], gates: [dependencies-present], safety: [flag-unknown-dependencies], tests: [TIM-006]}
      - {id: weekly-action-planner, invocation: explicit, inputs: [execution_timeline, progress_checkins, current_capacity], outputs: [weekly_action_plan], gates: [current-date-and-capacity], safety: [advisory-only], tests: [TIM-007]}
      - {id: next-action-navigator, invocation: explicit, inputs: [project_state, artifacts, execution_timeline, progress_checkins], outputs: [next_action_navigation], gates: [artifact-state-consistency], safety: [no-completion-assumption], tests: [TIM-008]}
      - {id: timeline-drift-monitor, invocation: explicit, inputs: [execution_timeline, progress_checkins, artifact_timestamps], outputs: [timeline_drift_report], gates: [baseline-or-execution-timeline], safety: [does-not-transition-state], tests: [TIM-009]}
      - {id: rebaseline-planner, invocation: explicit, inputs: [timeline_drift_report, changed_constraints, execution_timeline], outputs: [timeline_rebaseline_draft], gates: [user-confirmation-before-supersede], safety: [preserve-old-timeline], tests: [TIM-010]}
      - {id: deadline-readiness-gate, invocation: explicit, inputs: [execution_timeline, project_artifact_index], outputs: [deadline_readiness_report], gates: [required-artifacts-present], safety: [does-not-submit], tests: [TIM-011]}

  - id: topic-intelligence
    label: "Topic Intelligence & Sweet Spot"
    skills:
      - {id: source-authority-router, invocation: explicit, inputs: [local_source_metadata], outputs: [source_authority_classification], gates: [source-identity], safety: [no-web-fetch], tests: [TOP-001]}
      - {id: academic-evidence-lane, invocation: explicit, inputs: [source_authority_classification], outputs: [academic_evidence_lane], gates: [academic-source-criteria], safety: [intelligence-not-manuscript-evidence], tests: [TOP-002]}
      - {id: local-source-classifier, invocation: explicit, inputs: [imported_local_sources], outputs: [local_source_classification], gates: [metadata-presence], safety: [untrusted-imports], tests: [TOP-003]}
      - {id: field-map-builder, invocation: explicit, inputs: [academic_evidence_lane], outputs: [field_map], gates: [minimum-source-disclosure], safety: [no-fabricated-coverage], tests: [TOP-004]}
      - {id: research-lifecycle-assessor, invocation: explicit, inputs: [field_map, dated_sources], outputs: [research_lifecycle_assessment], gates: [date-evidence], safety: [insufficient-evidence-allowed], tests: [TOP-005]}
      - {id: research-trend-mapper, invocation: explicit, inputs: [dated_sources], outputs: [research_trend_map], gates: [dated-source-list], safety: [no-live-search], tests: [TOP-006]}
      - {id: growth-momentum-assessor, invocation: explicit, inputs: [dated_sources], outputs: [growth_momentum_assessment], gates: [two-24-month-windows], safety: [require-five-independent-sources-per-window], tests: [TOP-007]}
      - {id: field-opportunity-discovery, invocation: explicit, inputs: [field_map, trend_map, lifecycle_assessment], outputs: [field_opportunity_profile], gates: [evidence-list], safety: [opportunity-not-proof-of-gap], tests: [TOP-008]}
      - {id: topic-candidate-generator, invocation: explicit, inputs: [field_opportunity_profile, normalized_constraints], outputs: [topic_candidates], gates: [context-confirmed], safety: [draft-candidates-only], tests: [TOP-009]}
      - {id: topic-fingerprint-builder, invocation: explicit, inputs: [topic_candidates], outputs: [topic_fingerprints], gates: [candidate-defined], safety: [make-assumptions-visible], tests: [TOP-010]}
      - {id: topic-comparability-analyzer, invocation: explicit, inputs: [topic_fingerprints], outputs: [topic_comparability_report], gates: [two-or-more-candidates], safety: [no-precision-ranking], tests: [TOP-011]}
      - {id: field-sweet-spot-assessor, invocation: explicit, inputs: [field_opportunity_profile, academic_evidence_lane], outputs: [field_sweet_spot_assessment], gates: [field-evidence], safety: [not-a-project-feasibility-decision], tests: [TOP-012]}
      - {id: topic-feasibility-analyzer, invocation: explicit, inputs: [topic_candidates, normalized_constraints, timeline_baseline], outputs: [topic_feasibility_assessment], gates: [context-and-timeline-confirmed], safety: [no-data-access-assumption], tests: [TOP-013]}
      - {id: topic-ranking-tradeoff-explainer, invocation: explicit, inputs: [topic_feasibility_assessment, field_sweet_spot_assessment, topic_comparability_report], outputs: [topic_tradeoff_report], gates: [evidence-card-per-dimension], safety: [no-single-score], tests: [TOP-014]}
      - {id: project-sweet-spot-assessor, invocation: explicit, inputs: [normalized_constraints, timeline_baseline, topic_feasibility_assessment, field_opportunity_profile], outputs: [project_sweet_spot_assessment], gates: [five-sequential-gates], safety: [not-topic-approval], tests: [TOP-015]}
      - {id: topic-opportunity-report-builder, invocation: explicit, inputs: [topic_candidates, topic_tradeoff_report, project_sweet_spot_assessment], outputs: [topic_opportunity_report], gates: [context-confirmed], safety: [advisor-approval-required], tests: [TOP-016]}

  - id: literature-gap-board
    label: "Literature, Gap & Review Board"
    skills:
      - {id: research-literature-os, invocation: explicit, inputs: [local_literature], outputs: [literature_workspace], gates: [local-import-only], safety: [no-fabricated-citation], tests: [LIT-000]}
      - {id: literature-ingestion, invocation: explicit, inputs: [pdf_doi_bibtex_ris_csv_metadata], outputs: [source_record], gates: [identity-recorded], safety: [untrusted-input], tests: [LIT-001]}
      - {id: study-version-linker, invocation: explicit, inputs: [source_records], outputs: [study_version_relation], gates: [identity-evidence], safety: [do-not-merge-on-title-alone], tests: [LIT-002]}
      - {id: literature-role-classifier, invocation: explicit, inputs: [source_record], outputs: [project_role_record], gates: [role-rationale], safety: [not-manuscript-eligibility], tests: [LIT-003]}
      - {id: social-science-paper-parser, invocation: explicit, inputs: [user-approved-extract], outputs: [structured_paper_record], gates: [page-locations], safety: [no-full-pdf-assumption], tests: [LIT-004]}
      - {id: claim-evidence-extractor, invocation: explicit, inputs: [structured_paper_record], outputs: [claim_evidence_record], gates: [source-location], safety: [ai-extracted-unverified], tests: [LIT-005]}
      - {id: evidence-graph-builder, invocation: explicit, inputs: [claim_evidence_records], outputs: [evidence_graph], gates: [node-provenance], safety: [no-inferred-support], tests: [LIT-006]}
      - {id: theory-map-builder, invocation: explicit, inputs: [structured_paper_records], outputs: [theory_map], gates: [source-links], safety: [no-theory-invention], tests: [LIT-007]}
      - {id: method-map-builder, invocation: explicit, inputs: [structured_paper_records], outputs: [method_map], gates: [method-location], safety: [no-method-equivalence], tests: [LIT-008]}
      - {id: conflict-map-builder, invocation: explicit, inputs: [claim_evidence_records], outputs: [conflict_map], gates: [contradictory-claims-located], safety: [do-not-resolve-conflict-with-vote], tests: [LIT-009]}
      - {id: temporal-map-builder, invocation: explicit, inputs: [dated_source_records], outputs: [temporal_map], gates: [date-locations], safety: [no-trend-claim-without-dates], tests: [LIT-010]}
      - {id: reading-verification-tracker, invocation: explicit, inputs: [source_records, human_review_notes], outputs: [reading_verification_status], gates: [human-review-explicit], safety: [ai-read-not-human-verified], tests: [LIT-011]}
      - {id: literature-lifecycle-monitor, invocation: explicit, inputs: [source_records, correction_retraction_metadata], outputs: [literature_lifecycle_report], gates: [version-or-status-evidence], safety: [unknown-status-is-unknown], tests: [LIT-012]}
      - {id: citation-usage-tracker, invocation: explicit, inputs: [manuscript_claim_links], outputs: [citation_usage_record], gates: [claim-and-source-linked], safety: [no-support-inference], tests: [LIT-013]}
      - {id: literature-saturation-assessor, invocation: explicit, inputs: [field_map, source_records], outputs: [literature_saturation_assessment], gates: [coverage-evidence], safety: [no-universal-threshold], tests: [LIT-014]}
      - {id: contradiction-manager, invocation: explicit, inputs: [conflict_map], outputs: [contradiction_resolution_plan], gates: [conflict-preserved], safety: [do-not-delete-unfavorable-evidence], tests: [LIT-015]}
      - {id: research-lineage-builder, invocation: explicit, inputs: [theory_map, temporal_map], outputs: [research_lineage], gates: [source-links], safety: [no-lineage-from-keywords-only], tests: [LIT-016]}
      - {id: literature-reading-planner, invocation: explicit, inputs: [source_records, project_role_records], outputs: [reading_plan], gates: [priority-rationale], safety: [advisory-only], tests: [LIT-017]}
      - {id: research-gap-finder, invocation: explicit, inputs: [literature_workspace], outputs: [gap_cards], gates: [evidence-located], safety: [no-gap-from-summary-only], tests: [GAP-000]}
      - {id: literature-matrix-builder, invocation: explicit, inputs: [structured_paper_records], outputs: [literature_matrix], gates: [field-locations], safety: [missing-fields-disclosed], tests: [GAP-001]}
      - {id: research-question-fingerprint, invocation: explicit, inputs: [literature_matrix], outputs: [research_question_fingerprints], gates: [source-linked], safety: [not-a-gap-decision], tests: [GAP-002]}
      - {id: counterexample-locator, invocation: explicit, inputs: [claim_evidence_records], outputs: [counterexample_record], gates: [counterevidence-location], safety: [no-silencing-conflict], tests: [GAP-003]}
      - {id: gap-card-builder, invocation: explicit, inputs: [literature_matrix, counterexample_record], outputs: [gap_card], gates: [support-and-counterevidence], safety: [gap-is-a-hypothesis], tests: [GAP-004]}
      - {id: research-question-candidate-builder, invocation: explicit, inputs: [gap_cards, normalized_constraints], outputs: [research_question_candidates], gates: [context-confirmed], safety: [draft-only], tests: [GAP-005]}
      - {id: research-question-convergence, invocation: explicit, inputs: [research_question_candidates], outputs: [converged_research_question], gates: [scope-rationale], safety: [no-approval-claim], tests: [GAP-006]}
      - {id: gap-evidence-sufficiency-check, invocation: explicit, inputs: [gap_cards, research_question_candidates], outputs: [gap_evidence_sufficiency_report], gates: [support-and-counterevidence], safety: [insufficient-evidence-allowed], tests: [GAP-007]}
      - {id: research-review-board, invocation: explicit, inputs: [research_question, gap_cards, feasibility], outputs: [board_decision], gates: [user-confirmation], safety: [no-auto-go], tests: [BRD-000]}
      - {id: theory-reviewer, invocation: explicit, inputs: [research_question, theory_map], outputs: [theory_review_card], gates: [theory-links], safety: [advisory-only], tests: [BRD-001]}
      - {id: construct-reviewer, invocation: explicit, inputs: [research_question, constructs], outputs: [construct_review_card], gates: [construct-definitions], safety: [advisory-only], tests: [BRD-002]}
      - {id: method-fit-reviewer, invocation: explicit, inputs: [research_question, proposed_method], outputs: [method_fit_review_card], gates: [method-described], safety: [advisory-only], tests: [BRD-003]}
      - {id: data-feasibility-reviewer, invocation: explicit, inputs: [data_plan, access_constraints], outputs: [data_feasibility_review_card], gates: [access-evidence], safety: [fatal-flaw-on-core-data-missing], tests: [BRD-004]}
      - {id: execution-risk-reviewer, invocation: explicit, inputs: [timeline_baseline, feasibility], outputs: [execution_risk_review_card], gates: [timeline-confirmed], safety: [advisory-only], tests: [BRD-005]}
      - {id: capability-display-reviewer, invocation: explicit, inputs: [capability_inventory, proposed_design], outputs: [capability_display_review_card], gates: [capability-record], safety: [no-ability-inference], tests: [BRD-006]}
      - {id: resilience-reviewer, invocation: explicit, inputs: [fallback_options, timeline_baseline], outputs: [resilience_review_card], gates: [fallback-defined], safety: [advisory-only], tests: [BRD-007]}
      - {id: board-decision-builder, invocation: explicit, inputs: [review_cards], outputs: [board_decision], gates: [fatal-flaw-screen], safety: [user-confirmation-required], tests: [BRD-008]}

  - id: design-evidence
    label: "Research Design, Data & Evidence"
    skills:
      - {id: research-design, invocation: explicit, inputs: [approved_research_question], outputs: [research_protocol], gates: [board-go], safety: [not-ethics-approval], tests: [DES-000]}
      - {id: research-paradigm-selector, invocation: explicit, inputs: [research_question], outputs: [paradigm_choice], gates: [rationale], safety: [advisory-only], tests: [DES-001]}
      - {id: research-question-operationalizer, invocation: explicit, inputs: [research_question], outputs: [operationalization_record], gates: [observable-terms], safety: [no-measurement-invention], tests: [DES-002]}
      - {id: theoretical-model-builder, invocation: explicit, inputs: [research_question, theory_map], outputs: [theoretical_model], gates: [theory-links], safety: [model-is-proposed], tests: [DES-003]}
      - {id: hypothesis-builder, invocation: explicit, inputs: [theoretical_model], outputs: [hypothesis_set], gates: [testability], safety: [not-claimed-result], tests: [DES-004]}
      - {id: variable-dictionary-builder, invocation: explicit, inputs: [hypothesis_set], outputs: [variable_dictionary], gates: [observable-per-variable], safety: [no-unmeasurable-variable], tests: [DES-005]}
      - {id: measurement-planner, invocation: explicit, inputs: [variable_dictionary], outputs: [measurement_plan], gates: [source-or-development-rationale], safety: [no-scale-validity-claim], tests: [DES-006]}
      - {id: sample-recruitment-planner, invocation: explicit, inputs: [measurement_plan, resource_ethics_inventory], outputs: [sample_recruitment_plan], gates: [access-and-ethics], safety: [no-sample-guarantee], tests: [DES-007]}
      - {id: control-variable-planner, invocation: explicit, inputs: [theoretical_model, variable_dictionary], outputs: [control_variable_plan], gates: [rationale-per-control], safety: [no-kitchen-sink-controls], tests: [DES-008]}
      - {id: analysis-plan-builder, invocation: explicit, inputs: [hypothesis_set, variable_dictionary], outputs: [analysis_plan], gates: [test-per-hypothesis], safety: [no-result-forecast], tests: [DES-009]}
      - {id: causal-boundary-checker, invocation: explicit, inputs: [research_design, analysis_plan], outputs: [causal_boundary_report], gates: [design-described], safety: [block-unjustified-causality], tests: [DES-010]}
      - {id: interpretation-boundary-checker, invocation: explicit, inputs: [research_design], outputs: [interpretation_boundary_report], gates: [population-and-design-defined], safety: [no-overgeneralization], tests: [DES-011]}
      - {id: research-protocol-builder, invocation: explicit, inputs: [design_artifacts], outputs: [research_protocol], gates: [all-design-components], safety: [user-confirmation-needed], tests: [DES-012]}
      - {id: research-evidence-lab, invocation: explicit, inputs: [research_protocol], outputs: [evidence_workspace], gates: [protocol-ready], safety: [raw-data-forbidden], tests: [EVD-000]}
      - {id: raw-data-register, invocation: explicit, inputs: [path, sha256, access_class, truthfulness_declaration], outputs: [raw_data_register], gates: [no-raw-content], safety: [model-access-forbidden-default], tests: [EVD-001]}
      - {id: data-dictionary-builder, invocation: explicit, inputs: [variable_dictionary], outputs: [data_dictionary], gates: [variable-links], safety: [no-raw-data], tests: [EVD-002]}
      - {id: public-data-provider-router, invocation: explicit, inputs: [data_need], outputs: [provider_route], gates: [provider-configured], safety: [return-not-configured], tests: [EVD-003]}
      - {id: deidentified-summary-approval-gate, invocation: explicit, inputs: [summary_scope, user_approval], outputs: [deidentified_summary_approval], gates: [explicit-approval], safety: [minimum-necessary-summary], tests: [EVD-004]}
      - {id: data-cleaning-planner, invocation: explicit, inputs: [data_dictionary, approved_summary], outputs: [cleaning_plan], gates: [raw-register-or-approved-summary], safety: [no-fabricated-cleaning], tests: [EVD-005]}
      - {id: cleaned-data-version-register, invocation: explicit, inputs: [cleaning_plan, output_hash], outputs: [cleaned_data_version], gates: [lineage-link], safety: [no-content-ingestion], tests: [EVD-006]}
      - {id: analysis-run-register, invocation: explicit, inputs: [analysis_plan, code_hash, result_summary], outputs: [analysis_run], gates: [registered-input-version], safety: [no-unrun-result], tests: [EVD-007]}
      - {id: statistical-test-verifier, invocation: explicit, inputs: [analysis_run, analysis_plan], outputs: [statistical_verification], gates: [real-output-required], safety: [no-invented-statistics], tests: [EVD-008]}
      - {id: result-verification-gate, invocation: explicit, inputs: [analysis_run, statistical_verification], outputs: [verified_result_record], gates: [human-verification], safety: [no-result-fabrication], tests: [EVD-009]}
      - {id: figure-register, invocation: explicit, inputs: [verified_result_record, figure_metadata], outputs: [figure_record], gates: [result-link], safety: [no-misleading-chart-claim], tests: [EVD-010]}
      - {id: data-lineage-builder, invocation: explicit, inputs: [raw_data_register, cleaned_data_version, analysis_run], outputs: [data_lineage], gates: [hash-and-dependency-links], safety: [no-raw-content], tests: [EVD-011]}
      - {id: evidence-package-builder, invocation: explicit, inputs: [verified_result_records, data_lineage], outputs: [verified_evidence_package], gates: [verified-results-only], safety: [block-missing-evidence], tests: [EVD-012]}

  - id: manuscript-audit-review
    label: "Manuscript, Audit & Reviewer"
    skills:
      - {id: paper-architect, invocation: explicit, inputs: [research_protocol, verified_evidence_package], outputs: [manuscript_blueprint], gates: [evidence-ready], safety: [no-evidence-no-result-claim], tests: [MAN-000]}
      - {id: central-thesis-builder, invocation: explicit, inputs: [research_question, verified_evidence_package], outputs: [central_thesis], gates: [evidence-link], safety: [thesis-is-provisional], tests: [MAN-001]}
      - {id: argument-unit-builder, invocation: explicit, inputs: [central_thesis, evidence], outputs: [argument_units], gates: [claim-evidence-link], safety: [no-orphan-claim], tests: [MAN-002]}
      - {id: argument-tree-builder, invocation: explicit, inputs: [argument_units], outputs: [argument_tree], gates: [dependencies-acyclic], safety: [show-gaps], tests: [MAN-003]}
      - {id: claim-graph-builder, invocation: explicit, inputs: [argument_units, citations], outputs: [claim_graph], gates: [source-locations], safety: [no-unsupported-result], tests: [MAN-004]}
      - {id: argument-coverage-checker, invocation: explicit, inputs: [argument_tree, claim_graph], outputs: [argument_coverage_report], gates: [all-major-claims-checked], safety: [flag-gaps], tests: [MAN-005]}
      - {id: chapter-map-builder, invocation: explicit, inputs: [argument_tree, target_profile], outputs: [chapter_map], gates: [profile-selected], safety: [no-boilerplate-structure], tests: [MAN-006]}
      - {id: paragraph-blueprint-builder, invocation: explicit, inputs: [chapter_map, argument_units], outputs: [paragraph_blueprints], gates: [claim-or-purpose-per-paragraph], safety: [no-unlinked-paragraph], tests: [MAN-007]}
      - {id: logical-gap-reporter, invocation: explicit, inputs: [argument_tree, paragraph_blueprints], outputs: [logical_gap_report], gates: [coverage-check], safety: [do-not-fill-gaps-with-text], tests: [MAN-008]}
      - {id: academic-writing, invocation: explicit, inputs: [manuscript_blueprint, verified_evidence_package], outputs: [chapter_drafts], gates: [blueprint-ready], safety: [markdown-only], tests: [WRT-000]}
      - {id: introduction-writer, invocation: explicit, inputs: [introduction_blueprint], outputs: [introduction_draft], gates: [citation-links], safety: [no-fabricated-context], tests: [WRT-001]}
      - {id: literature-review-writer, invocation: explicit, inputs: [literature_blueprint], outputs: [literature_review_draft], gates: [source-links], safety: [no-summary-without-evidence], tests: [WRT-002]}
      - {id: theory-hypothesis-writer, invocation: explicit, inputs: [theory_blueprint], outputs: [theory_hypothesis_draft], gates: [model-and-source-links], safety: [no-result-claim], tests: [WRT-003]}
      - {id: method-writer, invocation: explicit, inputs: [research_protocol], outputs: [method_draft], gates: [protocol-ready], safety: [describe-only-real-method], tests: [WRT-004]}
      - {id: results-writer, invocation: explicit, inputs: [results_blueprint, verified_evidence_package], outputs: [results_draft], gates: [verified-evidence-required], safety: [block-without-results], tests: [WRT-005]}
      - {id: discussion-writer, invocation: explicit, inputs: [discussion_blueprint, verified_evidence_package], outputs: [discussion_draft], gates: [evidence-and-boundary-links], safety: [no-causal-overreach], tests: [WRT-006]}
      - {id: conclusion-writer, invocation: explicit, inputs: [conclusion_blueprint], outputs: [conclusion_draft], gates: [scope-boundaries], safety: [no-new-claims], tests: [WRT-007]}
